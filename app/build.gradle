plugins {
    id 'com.android.application'
}

def signingFile = rootProject.file('.signing/key.properties')
def signingValues = new Properties()
if (signingFile.exists()) signingFile.withInputStream { signingValues.load(it) }

android {
    namespace 'com.chemreview.app'
    compileSdk 36

    defaultConfig {
        applicationId 'com.chemreview.app'
        minSdk 23
        targetSdk 35
        versionCode 4
        versionName '1.0.1'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    signingConfigs {
        release {
            if (signingFile.exists()) {
                storeFile rootProject.file('.signing/chemistry-review.jks')
                storePassword signingValues['storePassword']
                keyAlias 'chemistry-review'
                keyPassword signingValues['keyPassword']
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            if (signingFile.exists()) signingConfig signingConfigs.release
        }
    }
}
